<!doctype html>
<html lang="en">
<head><title>Accessible sample page</title></head>
<body>
  <a href="#main">Skip to content</a>
  <nav aria-label="Primary"><a href="/about">About the project</a></nav>
  <main id="main">
    <h1>Quarterly report</h1>
    <h2>Revenue</h2>
    <img src="chart.png" alt="Revenue rose 12% over the quarter">
    <img src="divider.png" alt="" aria-hidden="true">
    <form>
      <label for="email">Email address</label>
      <input id="email" type="email">
      <button type="submit">Subscribe</button>
    </form>
    <table>
      <tr><th scope="col">Region</th><th scope="col">Total</th></tr>
      <tr><td>EMEA</td><td>1200</td></tr>
    </table>
    <video controls><track kind="captions" src="c.vtt" srclang="en" label="English"></video>
    <iframe src="map.html" title="Office location map"></iframe>
    <div role="status" aria-live="polite">Saved</div>
    <dialog aria-label="Confirm deletion"><p>Are you sure?</p></dialog>
  </main>
</body>
</html>
