name               = "toolkist"
main               = "worker/counter.js"
compatibility_date = "2025-01-01"

[assets]
directory = "dist"
binding   = "ASSETS"
# Run the Worker before serving assets so it can inject the per-tool
# window.__C__ helpful-count script into tool-page HTML (see counter.js).
# Non-tool assets still short-circuit to the asset layer inside the Worker.
run_worker_first = ["/tools/*"]

[[durable_objects.bindings]]
name       = "COUNTERS"
class_name = "Counter"

[[durable_objects.bindings]]
name       = "FEEDBACK"
class_name = "FeedbackStore"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["Counter"]

[[migrations]]
tag                = "v2"
new_sqlite_classes = ["FeedbackStore"]

[[routes]]
pattern = "toolkist.app"
custom_domain = true

# Legacy domain, routed here so the Worker can 301 it to toolkist.app
# (see LEGACY_HOSTS in worker/counter.js). Keep this route for as long as the
# old links should keep resolving.
[[routes]]
pattern = "lindetoolbox.com"
custom_domain = true
